<meta charset="utf-8">
<title>小型獨立運作系統 PCB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* 版面:整頁是 3D 舞台,左上角一張規格卡,底部一排視角按鈕 */
  :root {
    --stage: #e9edf3;          /* 舞台背景:帶一點防焊藍的淺灰 */
    --panel: rgba(255, 255, 255, 0.86);
    --ink: #142038;
    --muted: #5a6680;
    --line: rgba(20, 32, 56, 0.14);
    --accent: #1d3a8a;         /* 防焊藍 */
    --gold: #b8892c;           /* 沉金 */
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  /* 固定淺色主題,不跟隨系統深色模式 */
  :root { color-scheme: light; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--stage); color: var(--ink); font-family: var(--font-body);
    overflow: hidden; position: relative;
  }
  #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  .spec {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(320px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; backdrop-filter: blur(8px);
    display: grid; gap: 10px;
  }
  .spec h1 { margin: 0; font-size: 1.05rem; font-weight: 700; text-wrap: balance; letter-spacing: 0.02em; }
  .spec dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 0.8rem; }
  .spec dt { color: var(--muted); }
  .spec dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .models { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--line); border-radius: 8px; }
  .models button {
    flex: 1; font: 500 0.82rem var(--font-body); color: var(--ink); background: transparent;
    border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }
  .models button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
  .models button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .axes { display: grid; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); }
  .axes label { display: grid; grid-template-columns: 4.5em 1fr 3.2em; align-items: center; gap: 8px; font-size: 0.8rem; }
  .axes output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
  .axes input[type="range"] { width: 100%; accent-color: var(--accent); }
  .axes button { justify-self: start; font: 500 0.78rem var(--font-body); color: var(--ink); background: var(--line);
    border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .axes button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .axes .mode { display: flex; gap: 6px; }
  .axes .mode button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .axes input:disabled { opacity: 0.4; }
  .spec .hint { margin: 0; font-size: 0.75rem; color: var(--muted); }
  .spec { max-height: calc(100% - 110px); overflow-y: auto; }

  /* 零件拆分清單 */
  .parts { border-top: 1px solid var(--line); padding-top: 6px; font-size: 0.8rem; }
  .parts summary { cursor: pointer; font-weight: 500; padding: 2px 0; }
  .parts summary span { color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem; }
  .parts .tools { display: flex; gap: 6px; margin: 6px 0; }
  .parts .tools button { font: 500 0.75rem var(--font-body); color: var(--ink); background: var(--line);
    border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  .parts h2 { margin: 8px 0 2px; font-size: 0.72rem; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; }
  .part-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; }
  .part-row input { margin: 0; accent-color: var(--accent); }
  .part-row button { text-align: left; font: 400 0.8rem var(--font-body); color: var(--ink); background: transparent;
    border: 0; border-radius: 5px; padding: 3px 6px; cursor: pointer; }
  .part-row button:hover { background: var(--line); }
  .part-row button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .part-row .qty { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
  .parts button:focus-visible, .parts summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 選取零件的資訊卡 */
  .pick {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: max(16px, env(safe-area-inset-right, 0px));
    max-width: min(260px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(8px);
    display: grid; gap: 3px; font-size: 0.8rem;
  }
  .pick strong { font-size: 0.95rem; }
  .pick .meta { color: var(--muted); font-family: var(--font-mono); font-size: 0.75rem; }
  .pick button { justify-self: start; margin-top: 4px; font: 500 0.75rem var(--font-body); color: var(--ink);
    background: var(--line); border: 0; border-radius: 6px; padding: 4px 9px; cursor: pointer; }

  .views {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    left: 50%; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px; backdrop-filter: blur(8px);
    max-width: calc(100% - 32px);
  }
  .views button {
    font: 500 0.85rem var(--font-body); color: var(--ink); background: transparent;
    border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  .views button:hover { background: var(--line); }
  .views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .views button[aria-pressed="true"] { background: var(--accent); color: var(--stage); }

  .status {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-family: var(--font-mono); font-size: 0.9rem; color: var(--muted);
  }
  .status .bar { width: 180px; height: 3px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .status .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
  @media (max-width: 480px) {
    .spec { padding: 10px 12px; }
    .spec dl { font-size: 0.75rem; }
    .views button { padding: 7px 10px; font-size: 0.8rem; }
  }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.05, 0.12, 0.08);
scene.add(sun);

// 模型單位是公尺
const camera = new THREE.PerspectiveCamera(35, 1, 0.001, 5);
// TrackballControls:可往任何方向自由翻轉,不受 ±90° 限制
const controls = new TrackballControls(camera, canvas);
controls.rotateSpeed = 3.0;
controls.zoomSpeed = 1.2;
controls.panSpeed = 0.8;
controls.dynamicDampingFactor = 0.15;
controls.minDistance = 0.02;
controls.maxDistance = 1.2;   // 平台車約 0.26 m 寬

const MODELS = {
  pcb: {
    file: 'pcb.gltf.json', title: '小型獨立運作系統 PCB',
    specs: [['外形', '圓形 Ø40 mm'], ['板厚', '2.54 mm'], ['層數', '4 層'], ['主控', 'LQFP64 10×10']],
  },
  motor: {
    file: 'motor_2804.gltf.json', title: '2804 雲台無刷馬達',
    specs: [['外形', 'Ø34.5 × 15 mm'], ['中空軸', 'Ø6.5 mm'], ['頂部螺孔', '4 × M2.5 @ Ø16'],
            ['底部螺孔', '4 × M2.5 @ Ø19'], ['極對數', '7 (12N14P)'], ['KV', '220 KV']],
  },
  gimbal: {
    file: 'gimbal_2axis.gltf.json', title: '雙軸雲台(2 × 2804 模組)',
    specs: [['水平軸', '定子 + PCB 固定在底座,轉子帶動平台'], ['俯仰軸', '模組貼立板,轉子帶相機支架'],
            ['俯仰軸高', '76 mm'], ['連接', 'M2.5 銅柱 8 mm']],
  },
  car: {
    file: 'car_swerve.gltf.json', title: '舵輪平台車(8 × 2804 模組)',
    specs: [['驅動', '4 × 輪轂直驅,白色輪框 + 5 條 O 型環胎皮,Ø56'], ['轉向', '4 × 舵輪,可 360° 轉'], ['車身', '250 × 200 mm'],
            ['總高', '182 mm(含防水盒)'], ['連接', 'M2.5 銅柱 8 mm、橋架'], ['頂部', 'RS PRO 防水盒(放置)']],
  },
  waterbox: {
    file: 'water_box_main_pcb.gltf.json', title: '水情盒主板 Main_PCB V2.4',
    specs: [['外形', '100 × 100 mm 方形'], ['板厚', '2.54 mm(沿用 OBJ)'], ['層數', '2 層'],
            ['安裝孔', '4 × Ø3.0(角落)+ 4 × Ø3.0(中段)'], ['電源', 'DM02-36 降壓模組 × 2(3.3 V / 5 V)'],
            ['介面', 'LoRa、USB、DS3231、OLED、RANGE / SPEED 感測器']],
  },
  waterboxasm: {
    file: 'water_box.gltf.json', title: '水情盒(防水盒 + 底板 + RS485 + 主板 + SIM7000 + SEN0676 雷達 + AG-12)',
    specs: [['防水盒', 'RS PRO 1862264,225 × 175 × 81 mm'], ['底板', '205 × 155 × 2 mm,4 × ST3.0 × 6 鎖在盒底凸柱'],
            ['RS485 板', '下:M3 × 12 尼龍柱 + M3 × 6;上:M3 × 30 金屬公母柱'], ['RS485 位置', '底板較置中的孔組,兩板轉 270°,端子朝盒子中央'],
            ['主板', '最上層,M3 × 6 鎖在金屬柱頂;最高零件離盒蓋 7.8 mm'], ['SIM7000', '主板中段孔組,M3 × 14 尼龍柱;排針座伸進盒蓋 3.4 mm,柱子改 10 mm 可放下'], ['排線', 'XH 2.5 5P 雙頭 100 mm,SIM7000 -> 主板,J 形垂在板邊外'], ['插卡 / OLED', 'microSD 卡、Micro SIM 卡 × 2、1.3 吋 OLED、DS3231 時鐘模組、跳線帽 × 3(RANGE / SPEED / D_SENSOR 選 5V)'], ['LORA', '主板底面 XH2.5 7P 90° 公座 -> RS485 板 XH 7P,7P 排線 50 mm;原 1×7 母座與 LORA-SUP 排針移除'], ['BAT 線', 'RS485 BAT 2P 母頭(單線)-> 主板 DC 接頭 + 腳底面'], ['Wi-Fi 天線', '銅管天線 + IPEX 50 mm,插 ESP32-S3,平躺在 SIM7000 板下方'], ['雷達', '-X 短邊 Ø48.5 孔,O 型環 43.7 × 2.65 + AGJL-112 螺帽鎖緊,鏡頭朝外'], ['AG-12', '雷達右側上下兩顆,Ø12.2 孔,離右側 34、離底 19 / 44 mm'], ['看內部', '盒蓋預設隱藏,在零件拆分勾回即可顯示;也可拉爆炸圖']],
  },
  rs485: {
    file: 'rs485_v1.gltf.json', title: 'RS485 擴展板 V1',
    specs: [['外形', '100 × 100 mm 方形'], ['板厚', '2.54 mm(沿用 OBJ)'], ['層數', '2 層'],
            ['安裝孔', '4 × Ø3.0(角落)'], ['收發器', 'SP330(RS485 / RS232)'],
            ['介面', '4 × 端子(GND / B− / A+ / 24V)、主板 6P 排針、BAT']],
  },
  sim7000e: {
    file: 'sim7000e.gltf.json', title: 'SIM7000 IoT 模組板 V2.0',
    specs: [['外形', '59.7 × 65.7 mm'], ['板厚', '2.54 mm(沿用 OBJ)'], ['層數', '2 層'],
            ['安裝孔', '4 × Ø3.0,孔距 55.1 × 61.1 mm'], ['模組', 'SIMCom SIM7000(可換 SIM7070),IoT / GNSS 兩個 IPEX 天線座'],
            ['介面', '5P 排針(V / T / R / SW / G)、2 × SIM 卡座'], ['高度', '電解電容不裝(已刪);最高零件 5P 排針座,離板面 5.7 mm']],
  },
  sen0676: {
    file: 'sen0676.gltf.json', title: 'SEN0676 80 GHz 雷達液位感測器',
    specs: [['外殼', '官方 STEP:六角法蘭 62、G1½ 螺紋、長 53.65 mm'], ['電路板', '35 × 35 mm(依尺寸圖重建,四角 R2)'],
            ['安裝', '雷達晶片朝鏡頭,4 × M2.5 × 6 自攻鎖進凸柱'], ['孔位', '31 × 31 mm,Ø2.6'],
            ['介面', '5P:TX / RX / DE / GND / VCC(2.54 mm)'], ['看內部', '拉爆炸圖,或在零件拆分取消勾選外殼']],
  },
  ag12: {
    file: 'ag12.gltf.json', title: 'KSS AG-12 尼龍電纜固定頭',
    specs: [['螺紋', 'M12 × 1.25,L1 7.9,開孔 Ø12 +0.2'], ['外形', '本體六角 15.2、迫緊頭 Ø15.5、總高 30'],
            ['線徑', '3 ~ 6.5 mm'], ['螺帽', 'AGL-12 對邊 17、高 5.2'], ['面板', '以 3.09 mm(水情盒牆厚)擺放螺帽'],
            ['材質', 'NYLON 66 黑、夾緊圈 TPE、墊片 PVC']],
  },
  assembly: {
    file: 'pcb_motor_assembly.gltf.json', title: 'PCB + 2804 馬達組合',
    specs: [['安裝面', 'PCB 背面'], ['銅柱', '4 × M2.5 公母 6.5 mm'], ['螺絲', '4 × M2.5 × 6 盤頭(正面)'],
            ['孔位', 'Ø19,與板上安裝孔對齊'], ['出線', '焊到 U / V / W 焊墊'], ['總高', '約 25.5 mm']],
  },
};
// 視角方向(相對模型中心),距離依模型大小計算
const DIRS = { iso: [0, 1, 1], top: [0, 1, 0], bottom: [0, -1, 0], side: [0, 0.15, 1] };
// 各視角的畫面「上方」方向(正視/背視時改用 -Z / +Z 才不會退化)
const UPS = { iso: [0, 1, 0], top: [0, 0, -1], bottom: [0, 0, 1], side: [0, 1, 0] };
const center = new THREE.Vector3();
let radius = 0.03;

function viewPos(name) {
  const d = new THREE.Vector3(...DIRS[name]).normalize();
  return d.multiplyScalar(radius * 3.4).add(center);
}
let tween = null;
function goTo(name, instant = false) {
  const from = camera.position.clone();
  const to = viewPos(name);
  const fromT = controls.target.clone();
  const fromUp = camera.up.clone();
  const toUp = new THREE.Vector3(...UPS[name]);
  const t0 = performance.now();
  const reduce = instant || matchMedia('(prefers-reduced-motion: reduce)').matches;
  tween = (now) => {
    const k = reduce ? 1 : Math.min(1, (now - t0) / 600);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(from, to, e);
    controls.target.lerpVectors(fromT, center, e);
    camera.up.lerpVectors(fromUp, toUp, e);
    if (camera.up.lengthSq() < 1e-6) camera.up.copy(toUp);
    camera.up.normalize();
    if (k >= 1) tween = null;
  };
}

for (const name of ['iso', 'top', 'bottom', 'side']) {
  document.getElementById('v-' + name).addEventListener('click', () => goTo(name));
}
const spinBtn = document.getElementById('v-spin');
let spinning = false;
spinBtn.addEventListener('click', () => {
  spinning = !spinning;
  spinBtn.setAttribute('aria-pressed', String(spinning));
});
const spinOffset = new THREE.Vector3();
function spin() {  // 繞目前畫面的上方軸轉動相機
  spinOffset.subVectors(camera.position, controls.target).applyAxisAngle(camera.up, 0.006);
  camera.position.copy(controls.target).add(spinOffset);
}

function syncBackground() {
  const c = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim();
  scene.background = new THREE.Color(c || '#e9edf3');
}
syncBackground();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBackground);
new MutationObserver(syncBackground).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  // 窄螢幕時把鏡頭拉遠,讓整塊板子留在畫面內
  camera.fov = camera.aspect < 1 ? 35 / Math.max(camera.aspect, 0.5) : 35;
  camera.updateProjectionMatrix();
  controls.handleResize();
}
window.addEventListener('resize', resize);
resize();

const statusEl = document.getElementById('status');
const statusText = document.getElementById('status-text');
const bar = document.getElementById('bar');
const loader = new GLTFLoader();
const cache = {};
let current = null, loadToken = 0;

function showSpecs(key) {
  const m = MODELS[key];
  document.getElementById('spec-title').textContent = m.title;
  const dl = document.getElementById('spec-list');
  dl.replaceChildren(...m.specs.flatMap(([k, v]) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    return [dt, dd];
  }));
  for (const id of Object.keys(MODELS)) {
    document.getElementById('m-' + id).setAttribute('aria-pressed', String(id === key));
  }
}

// 雙軸雲台:滑桿轉動 pan_group(繞 Y)與 tilt_group(繞 X)
const axesEl = document.getElementById('axes');
const panIn = document.getElementById('pan'), tiltIn = document.getElementById('tilt');
let panNode = null, tiltNode = null;
function applyAxes() {
  document.getElementById('pan-out').textContent = panIn.value + '°';
  document.getElementById('tilt-out').textContent = tiltIn.value + '°';
  if (panNode) panNode.rotation.y = THREE.MathUtils.degToRad(+panIn.value);
  if (tiltNode) tiltNode.rotation.x = THREE.MathUtils.degToRad(+tiltIn.value);  // 正值 = 抬頭
}
panIn.addEventListener('input', applyAxes);
tiltIn.addEventListener('input', applyAxes);
document.getElementById('axes-reset').addEventListener('click', () => {
  panIn.value = 0; tiltIn.value = 0; applyAxes();
});

// 舵輪平台車:steer_*(繞 Y)、wheel_*(繞 X);角度與方向存在 glTF extras(three.js 的 userData)
const carEl = document.getElementById('car-axes');
const steerIn = document.getElementById('steer'), wheelIn = document.getElementById('wheel');
const driveBtn = document.getElementById('car-drive'), spinModeBtn = document.getElementById('car-spin');
const playBtn = document.getElementById('car-play');
let steerNodes = [], wheelNodes = [], carSpin = false, carPlaying = false, wheelAngle = 0;
function applyCar() {
  const steer = +steerIn.value;
  document.getElementById('steer-out').textContent = carSpin ? '自動' : steer + '°';
  document.getElementById('wheel-out').textContent = Math.round(wheelAngle) + '°';
  steerIn.disabled = carSpin;
  driveBtn.setAttribute('aria-pressed', String(!carSpin));
  spinModeBtn.setAttribute('aria-pressed', String(carSpin));
  for (const n of steerNodes) {
    n.rotation.y = THREE.MathUtils.degToRad(carSpin ? n.userData.spin_steer : steer);
  }
  for (const n of wheelNodes) {   // 原地旋轉時四輪同向即可繞中心轉
    n.rotation.x = THREE.MathUtils.degToRad(wheelAngle * (carSpin ? 1 : n.userData.spin_sign));
  }
}
steerIn.addEventListener('input', applyCar);
wheelIn.addEventListener('input', () => { wheelAngle = +wheelIn.value; applyCar(); });
driveBtn.addEventListener('click', () => { carSpin = false; applyCar(); });
spinModeBtn.addEventListener('click', () => { carSpin = true; applyCar(); });
playBtn.addEventListener('click', () => {
  carPlaying = !carPlaying;
  playBtn.setAttribute('aria-pressed', String(carPlaying));
  playBtn.textContent = carPlaying ? '暫停' : '播放';
});
document.getElementById('car-reset').addEventListener('click', () => {
  steerIn.value = 0; wheelIn.value = 0; wheelAngle = 0; carSpin = false; applyCar();
});
function stepCar() {
  if (!carPlaying || !wheelNodes.length) return;
  wheelAngle = ((wheelAngle + 2 + 180) % 360) - 180;
  wheelIn.value = Math.round(wheelAngle);
  applyCar();
}

// ---- 爆炸圖與零件拆分:資料來自 glTF extras(three.js 的 userData)----
//   part    = { id, name, group, pcs, note }:同 id 的節點是同一種零件(例如四個角的轉向叉);
//             pcs = 這個節點算幾件(馬達的轉子節點記 0,選取時與定子一起)
//   explode = [x, y, z]:爆炸圖 100% 時在父節點座標中的位移(公尺)
const explodeBox = document.getElementById('explode-box'), explodeIn = document.getElementById('explode');
const partsEl = document.getElementById('parts'), partsList = document.getElementById('parts-list');
const pickEl = document.getElementById('pick');
const GROUP_ORDER = ['列印件', '馬達', '電路板', '電子', '外購件', '五金'];
const DEFAULT_HIDDEN = new Set(['box_lid']);   // 載入時預設不顯示的零件(防水盒盒蓋)
let explodeNodes = [], parts = new Map(), selected = null;
const ghostCache = new Map();
function ghostOf(mat) {   // 未選取的零件改用半透明材質
  if (!ghostCache.has(mat)) {
    const g = mat.clone();
    g.transparent = true; g.opacity = 0.12; g.depthWrite = false;
    ghostCache.set(mat, g);
  }
  return ghostCache.get(mat);
}
function applyExplode() {
  const t = +explodeIn.value / 100;
  document.getElementById('explode-out').textContent = explodeIn.value + '%';
  for (const n of explodeNodes) n.position.copy(n.userData.baseP).addScaledVector(n.userData.dirP, t);
}
explodeIn.addEventListener('input', applyExplode);

function partOf(obj) {
  for (let o = obj; o && o !== current; o = o.parent) if (o.userData.part) return o.userData.part.id;
  return null;
}
function shownInScene(obj) {
  for (let o = obj; o; o = o.parent) if (!o.visible) return false;
  return true;
}
function applySelection() {
  const keep = new Set();
  if (selected) for (const n of parts.get(selected).nodes) n.traverse((o) => keep.add(o));
  current.traverse((o) => {
    if (!o.isMesh) return;
    if (!o.userData.mat0) o.userData.mat0 = o.material;
    o.material = !selected || keep.has(o) ? o.userData.mat0 : ghostOf(o.userData.mat0);
  });
  for (const b of partsList.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.id === selected));
  pickEl.hidden = !selected;
  if (selected) {
    const p = parts.get(selected);
    document.getElementById('pick-name').textContent = p.name;
    document.getElementById('pick-meta').textContent = `${p.group} · 共 ${p.qty} 件`;
    document.getElementById('pick-note').textContent = p.note;
  }
}
function select(id) { selected = id; applySelection(); }

function buildParts(root) {
  parts = new Map();
  root.traverse((o) => {
    const p = o.userData.part;
    if (!p) return;
    if (!parts.has(p.id)) parts.set(p.id, { ...p, nodes: [] });
    parts.get(p.id).nodes.push(o);
  });
  let total = 0;
  // 每個節點的件數加總;轉子節點記 0(與定子同一顆馬達)
  for (const p of parts.values()) { p.qty = p.nodes.reduce((a, n) => a + (n.userData.part.pcs === undefined ? 1 : n.userData.part.pcs), 0); total += p.qty; }
  const groups = [...new Set([...parts.values()].map((p) => p.group))]
    .sort((a, b) => (GROUP_ORDER.indexOf(a) + 99) % 99 - (GROUP_ORDER.indexOf(b) + 99) % 99);
  partsList.replaceChildren(...groups.flatMap((g) => {
    const h = document.createElement('h2'); h.textContent = g;
    const rows = [...parts.values()].filter((p) => p.group === g).map((p) => {
      const row = document.createElement('div'); row.className = 'part-row';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = p.nodes[0].visible;
      cb.setAttribute('aria-label', '顯示' + p.name);
      cb.addEventListener('change', () => { for (const n of p.nodes) n.visible = cb.checked; });
      const b = document.createElement('button'); b.type = 'button'; b.textContent = p.name; b.dataset.id = p.id;
      b.addEventListener('click', () => select(selected === p.id ? null : p.id));
      const q = document.createElement('span'); q.className = 'qty'; q.textContent = '×' + p.qty;
      row.append(cb, b, q);
      return row;
    });
    return [h, ...rows];
  }));
  document.getElementById('parts-count').textContent = `${parts.size} 種 · ${total} 件`;
  partsEl.hidden = !parts.size;
}
document.getElementById('parts-show-all').addEventListener('click', () => {
  for (const p of parts.values()) for (const n of p.nodes) n.visible = true;
  for (const cb of partsList.querySelectorAll('input')) cb.checked = true;
});
document.getElementById('parts-clear').addEventListener('click', () => select(null));
document.getElementById('pick-close').addEventListener('click', () => select(null));
addEventListener('keydown', (e) => { if (e.key === 'Escape' && selected) select(null); });

// 在畫面上點零件選取(拖曳超過 4 px 視為旋轉,不算點選)
const raycaster = new THREE.Raycaster();
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || !parts.size || !current) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 4) return;
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1,
                                            -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = raycaster.intersectObject(current, true).find((h) => shownInScene(h.object) && partOf(h.object));
  select(hit ? partOf(hit.object) : null);
});

function place(key, root) {
  panNode = root.getObjectByName('pan_group') || null;
  tiltNode = root.getObjectByName('tilt_group') || null;
  axesEl.hidden = !panNode;
  if (panNode) applyAxes();
  steerNodes = []; wheelNodes = [];
  root.traverse((o) => {
    if ('spin_steer' in o.userData) steerNodes.push(o);
    if ('spin_sign' in o.userData) wheelNodes.push(o);
  });
  carEl.hidden = !steerNodes.length;
  if (steerNodes.length) applyCar();
  explodeNodes = [];
  root.traverse((o) => {
    if (!o.userData.explode) return;
    if (!o.userData.baseP) {
      o.userData.baseP = o.position.clone();
      o.userData.dirP = new THREE.Vector3().fromArray(o.userData.explode);
    }
    explodeNodes.push(o);
  });
  explodeBox.hidden = !explodeNodes.length;
  explodeIn.value = 0;
  if (explodeNodes.length) applyExplode();
  if (current) scene.remove(current);
  current = root;
  selected = null;
  buildParts(root);
  applySelection();
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  box.getCenter(center);
  radius = box.getSize(new THREE.Vector3()).length() / 2;
  goTo('iso', true);
  statusEl.hidden = true;
}

function load(key) {
  showSpecs(key);
  const token = ++loadToken;
  if (cache[key]) { place(key, cache[key]); return; }
  statusEl.hidden = false;
  statusText.textContent = '載入模型中…';
  bar.parentElement.hidden = false;
  bar.style.width = '0';
  loader.load(MODELS[key].file, (gltf) => {
    gltf.scene.traverse((o) => {
      if (o.isMesh && o.material.map) o.material.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (o.userData.part && DEFAULT_HIDDEN.has(o.userData.part.id)) o.visible = false;   // 預設隱藏(零件清單可勾回)
    });
    cache[key] = gltf.scene;
    if (token === loadToken) place(key, gltf.scene);
  }, (ev) => {
    if (ev.total && token === loadToken) bar.style.width = (100 * ev.loaded / ev.total).toFixed(0) + '%';
  }, (err) => {
    if (token !== loadToken) return;
    statusText.textContent = '模型載入失敗:' + (err.message || err) + '。請重新整理頁面再試一次。';
    bar.parentElement.hidden = true;
  });
}

function fromHash() { const k = location.hash.slice(1); return k in MODELS ? k : 'pcb'; }
for (const key of Object.keys(MODELS)) {
  document.getElementById('m-' + key).addEventListener('click', () => {
    if (fromHash() !== key) location.hash = key; else load(key);
  });
}
window.addEventListener('hashchange', () => load(fromHash()));
load(fromHash());

renderer.setAnimationLoop((now) => {
  if (tween) tween(now);
  else if (spinning) spin();
  stepCar();
  controls.update();
  renderer.render(scene, camera);
});
</script>
